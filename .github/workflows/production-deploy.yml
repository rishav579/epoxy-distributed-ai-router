name: production-deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'semantic-router' }}
  ECR_GATEWAY_REPOSITORY: ${{ vars.ECR_GATEWAY_REPOSITORY || 'semantic-router-gateway' }}
  ECR_WORKER_REPOSITORY: ${{ vars.ECR_WORKER_REPOSITORY || 'semantic-router-worker' }}

jobs:
  test:
    name: E2E test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: inference
          POSTGRES_USER: inference
          POSTGRES_PASSWORD: inference_local_password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U inference -d inference"
          --health-interval 3s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: inference
          RABBITMQ_DEFAULT_PASS: inference_local_password
          RABBITMQ_DEFAULT_VHOST: /
        ports: [5672:5672, 15672:15672]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-worker.txt
            requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-worker.txt -r requirements-test.txt
      - name: Start gateway and worker, then run E2E test
        env:
          DATABASE_URL: postgresql://inference:inference_local_password@127.0.0.1:5432/inference
          AMQP_URL: amqp://inference:inference_local_password@127.0.0.1:5672/
          LOCAL_MODEL_REGISTRY_DIR: ${{ github.workspace }}/outputs/adapter
        run: |
          set -euo pipefail
          python -m uvicorn inference_gateway:app --host 127.0.0.1 --port 8000 > gateway.log 2>&1 & GATEWAY_PID=$!
          python inference_worker.py > worker.log 2>&1 & WORKER_PID=$!
          trap 'kill "$WORKER_PID" "$GATEWAY_PID" 2>/dev/null || true' EXIT INT TERM
          for attempt in $(seq 1 120); do
            if ! kill -0 "$GATEWAY_PID" 2>/dev/null || ! kill -0 "$WORKER_PID" 2>/dev/null; then
              cat gateway.log worker.log; exit 1
            fi
            if curl --fail --silent http://127.0.0.1:8000/metrics >/dev/null && curl --fail --silent http://127.0.0.1:8001/metrics >/dev/null; then break; fi
            if [ "$attempt" = 120 ]; then cat gateway.log worker.log; exit 1; fi
            sleep 1
          done
          python test_e2e_pipeline.py
      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-service-logs
          path: '*.log'

  build-and-push:
    name: Build and push images
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: github-production-build-${{ github.run_id }}
      - name: Ensure immutable ECR repositories exist
        run: |
          set -euo pipefail
          for repository in "$ECR_GATEWAY_REPOSITORY" "$ECR_WORKER_REPOSITORY"; do
            if ! aws ecr describe-repositories --repository-names "$repository" >/dev/null 2>&1; then
              aws ecr create-repository --repository-name "$repository" --image-tag-mutability IMMUTABLE --image-scanning-configuration scanOnPush=true >/dev/null
            fi
          done
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push commit-tagged images
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --file Dockerfile.gateway --tag "$ECR_REGISTRY/$ECR_GATEWAY_REPOSITORY:$IMAGE_TAG" .
          docker build --file Dockerfile.worker --tag "$ECR_REGISTRY/$ECR_WORKER_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_GATEWAY_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_WORKER_REPOSITORY:$IMAGE_TAG"

  deploy:
    name: Deploy to EKS
    needs: build-and-push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: github-production-deploy-${{ github.run_id }}
      - name: Configure kubectl
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          kubectl cluster-info
      - name: Apply manifests with immutable images
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          sed -i "s|registry.example.com/inference-gateway:sha-REPLACE_ME|$REGISTRY/$ECR_GATEWAY_REPOSITORY:$IMAGE_TAG|" deploy/kubernetes/gateway.yaml
          sed -i "s|registry.example.com/inference-worker:sha-REPLACE_ME|$REGISTRY/$ECR_WORKER_REPOSITORY:$IMAGE_TAG|" deploy/kubernetes/worker.yaml
          kubectl apply --server-side --filename deploy/kubernetes/gateway.yaml
          kubectl apply --server-side --filename deploy/kubernetes/worker.yaml
          kubectl apply --server-side --filename deploy/kubernetes/worker-hpa.yaml
          kubectl rollout status deployment/inference-gateway --timeout=5m
          kubectl rollout status deployment/inference-worker --timeout=10m
